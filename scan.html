<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14243d">
<title>Scanner – DocuWorks Studio</title>
<style>
:root{--n:#14243d;--t:#2dd4bf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px system-ui,"Segoe UI","Nirmala UI","Noto Sans Bengali",sans-serif;background:#0b1424;color:#fff;overflow:hidden}
.scr{display:none;position:fixed;inset:0;flex-direction:column}.scr.on{display:flex}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--n)}
header b{flex:1}header a{color:#5eead4;text-decoration:none;font-size:13px}
input#fn{background:#0b1424;border:1px solid #2c4468;color:#fff;border-radius:8px;padding:6px 10px;width:150px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:#233a5e;color:#fff;cursor:pointer}
button.p,.btn.p{background:var(--t);color:#06231f;font-weight:700}
#grid{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.pg{background:#14243d;border-radius:10px;padding:6px;text-align:center}
.pg img{width:100%;height:170px;object-fit:contain;background:#fff;border-radius:6px;cursor:pointer}
.pc{display:flex;justify-content:space-between;align-items:center;margin-top:5px}.pc button{padding:4px 9px}
.empty{grid-column:1/-1;text-align:center;color:#9fb3cf;padding:60px 10px;line-height:1.7}
footer{display:flex;gap:8px;padding:10px;background:var(--n);justify-content:center;flex-wrap:wrap}
#vid{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.cbar{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;padding:18px;background:linear-gradient(transparent,#000a)}
.shot{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:var(--t);padding:0}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;overflow:auto}
#ec{touch-action:none;max-width:100%;max-height:100%}
#adjustPanel{display:none;background:#102039;padding:9px 14px 11px;border-top:1px solid #263d5e}
#adjustPanel.visible{display:block}
.adjust-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px;color:#dce8f5;font-size:12px;font-weight:700}
#tResetAdjust{padding:5px 10px;font-size:11px;background:#233a5e;color:#dce8f5}
.adjust-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.adjust-control{display:block;min-width:0;color:#aebfd3;font-size:11px}
.adjust-label{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:3px}
.adjust-value{color:#5eead4;font-variant-numeric:tabular-nums;font-weight:700}
.adjust-control input{display:block;width:100%;height:20px;margin:0;accent-color:#2dd4bf;cursor:pointer}
#eTools{display:flex;gap:8px;padding:10px;background:var(--n);overflow:auto;justify-content:center;align-items:center;flex-wrap:wrap}
@media(max-width:520px){.adjust-controls{gap:9px}.adjust-control{font-size:10px}.adjust-head{margin-bottom:5px}}
.chip.on{background:var(--t);color:#06231f;font-weight:700}
dialog{border:0;border-radius:14px;padding:16px;width:min(560px,92vw);background:#fff;color:#14243d}
dialog textarea{width:100%;height:240px;margin:10px 0;font:inherit}
#exportDlg{max-height:88vh;overflow:hidden}
#exportPageList{display:flex;flex-direction:column;gap:8px;max-height:58vh;overflow:auto;margin:14px 0}
.export-row{display:flex;align-items:center;gap:11px;padding:7px;border:1px solid #d8e0e8;border-radius:9px;cursor:pointer}
.export-row input{width:18px;height:18px;accent-color:#0d9b83;flex:0 0 auto}
.export-row img{width:42px;height:54px;object-fit:contain;background:#eef2f4;border-radius:4px}
.export-row span{font-weight:600}
#exportDlg .export-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.dropzone{flex:0 0 auto;margin:10px 12px 0;padding:13px 16px;border:2px dashed #496486;border-radius:12px;background:#12223a;color:#d8e7f5;text-align:center;cursor:pointer;transition:background .15s,border-color .15s}
.dropzone strong{color:#5eead4}.dropzone small{display:block;color:#9fb3cf;margin-top:3px}
.dropzone.over{border-color:#2dd4bf;background:#163b45}
.busy{position:fixed;inset:0;z-index:100;background:#06101dcc;display:flex;align-items:center;justify-content:center;padding:20px}
.busy[hidden]{display:none}.busy-card{display:flex;align-items:center;gap:12px;background:#14243d;border:1px solid #385477;border-radius:14px;padding:16px 20px;max-width:min(420px,92vw);box-shadow:0 12px 45px #0008}
.spinner{width:22px;height:22px;flex:0 0 22px;border:3px solid #55708f;border-top-color:#2dd4bf;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style> </head>
<body>
<div id="home" class="scr on">
  <header><b>Scanner</b><input id="fn" value="Scan" aria-label="File name"><a href="index.html">← Studio</a></header>
  <div id="dropZone" class="dropzone" role="button" tabindex="0" aria-label="Drop images here or click to browse">
    <strong>⇩ Drop images here</strong> or click to browse
    <small>Upload one or several JPG, PNG or WEBP images</small>
  </div>
  <div id="grid"></div>
  <footer>
    <button class="p" id="bCam">📷 Scan</button>
    <label class="btn">🖼 Import<input id="fIn" type="file" accept="image/*" multiple hidden></label>
    <button id="bPdf">⬇ PDF</button>
    <button id="bOcr">Aa Text</button>
  </footer>
</div>
<div id="cam" class="scr">
  <video id="vid" playsinline autoplay muted></video>
  <div class="cbar"><button id="cClose">✕ Close</button><button class="shot" id="cShot" aria-label="Capture"></button><span id="cN" style="min-width:70px;text-align:right"></span></div>
</div>
<div id="edit" class="scr">
  <header><button id="eBack">‹</button><b id="eTitle"></b><button class="p" id="eNext">Next</button></header>
  <div id="stage"><canvas id="ec"></canvas></div>
  <section id="adjustPanel" aria-label="Image adjustments">
    <div class="adjust-head"><strong>Image adjustments</strong><button id="tResetAdjust" type="button">Reset</button></div>
    <div class="adjust-controls">
      <label class="adjust-control"><span class="adjust-label">Brightness <output class="adjust-value" data-adjust-value="brightness">0</output></span><input type="range" min="-100" max="100" step="1" value="0" data-adjust="brightness" aria-label="Brightness"></label>
      <label class="adjust-control"><span class="adjust-label">Shadows <output class="adjust-value" data-adjust-value="shadows">0</output></span><input type="range" min="-100" max="100" step="1" value="0" data-adjust="shadows" aria-label="Shadows"></label>
      <label class="adjust-control"><span class="adjust-label">Highlights <output class="adjust-value" data-adjust-value="highlights">0</output></span><input type="range" min="-100" max="100" step="1" value="0" data-adjust="highlights" aria-label="Highlights"></label>
      <label class="adjust-control"><span class="adjust-label">Contrast <output class="adjust-value" data-adjust-value="contrast">0</output></span><input type="range" min="-100" max="100" step="1" value="0" data-adjust="contrast" aria-label="Contrast"></label>
      <label class="adjust-control"><span class="adjust-label">Paper white <output class="adjust-value" data-adjust-value="paper">0</output></span><input type="range" min="0" max="100" step="1" value="0" data-adjust="paper" aria-label="Paper white"></label>
      <label class="adjust-control"><span class="adjust-label">Sharpness <output class="adjust-value" data-adjust-value="sharpness">0</output></span><input type="range" min="0" max="100" step="1" value="0" data-adjust="sharpness" aria-label="Sharpness"></label>
    </div>
  </section>
  <div id="eTools"></div>
</div>
<dialog id="dlg"><b>Extracted text</b><textarea id="ocrT"></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button id="oCopy">Copy</button><button id="oDl">Download .txt</button><button class="p" id="oClose">Close</button></div>
</dialog>
<dialog id="exportDlg">
  <b>Select pages to export</b>
  <p style="margin:6px 0;color:#526174;font-size:13px">Choose the pages you want in the PDF. They will stay in their original order.</p>
  <div id="exportPageList"></div>
  <div class="export-actions">
    <button id="exportToggleAll">Deselect all</button>
    <button id="exportCancel">Cancel</button>
    <button class="p" id="exportSelected">Export selected</button>
  </div>
</dialog>
<div id="busy" class="busy" hidden aria-live="polite" aria-busy="true"><div class="busy-card"><span class="spinner"></span><span id="busyText">Preparing image…</span></div></div>
<script>
const $=s=>document.querySelector(s),ec=$('#ec'),pages=[];
let ed={},Q=[],stream=null,fromCam=false,importTotal=0,importDone=0;
const show=id=>document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

const inset=s=>{const x=s.width*.05,y=s.height*.05;return[[x,y],[s.width-x,y],[s.width-x,s.height-y],[x,s.height-y]]};

/* ---------- perspective warp (pure JS) ---------- */
function solve(A,b){const n=8;for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];
  for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}
  const x=Array(n);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i]}return x}
function warp(src,q){
  const d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let W=Math.max(d(q[0],q[1]),d(q[3],q[2])),H=Math.max(d(q[0],q[3]),d(q[1],q[2]));
  const sc=Math.min(1,3200/Math.max(W,H));W=Math.max(2,Math.round(W*sc));H=Math.max(2,Math.round(H*sc));
  const D=[[0,0],[W,0],[W,H],[0,H]],A=[],B=[];
  for(let i=0;i<4;i++){const[u,v]=D[i],[x,y]=q[i];A.push([u,v,1,0,0,0,-u*x,-v*x]);B.push(x);A.push([0,0,0,u,v,1,-u*y,-v*y]);B.push(y)}
  const h=solve(A,B),o=mk(W,H),SW=src.width,SH=src.height,s=src.getContext('2d').getImageData(0,0,SW,SH).data,od=o.getContext('2d').createImageData(W,H),t=od.data;
  for(let v=0;v<H;v++)for(let u=0;u<W;u++){
    const z=h[6]*u+h[7]*v+1,x=(h[0]*u+h[1]*v+h[2])/z,y=(h[3]*u+h[4]*v+h[5])/z,x0=Math.floor(x),y0=Math.floor(y),i=(v*W+u)*4;
    if(x0<0||y0<0||x0>=SW-1||y0>=SH-1){t[i]=t[i+1]=t[i+2]=255;t[i+3]=255;continue}
    const fx=x-x0,fy=y-y0,p=(y0*SW+x0)*4,p2=p+4,r=p+SW*4,r2=r+4;
    for(let c=0;c<3;c++)t[i+c]=(s[p+c]*(1-fx)+s[p2+c]*fx)*(1-fy)+(s[r+c]*(1-fx)+s[r2+c]*fx)*fy;
    t[i+3]=255;
  }
  o.getContext('2d').putImageData(od,0,0);return o;
}

/* ---------- filters (paper-white background correction) ---------- */
function bgGrid(c){
  const W=c.width,H=c.height,d=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data;
  const B=Math.max(16,Math.round(Math.max(W,H)/36)),gw=Math.ceil(W/B),gh=Math.ceil(H/B),g=new Float32Array(gw*gh);
  const br=new Float32Array(gw*gh),bg=new Float32Array(gw*gh),bb=new Float32Array(gw*gh);
  for(let by=0;by<gh;by++)for(let bx=0;bx<gw;bx++){
    const l=[],rr=[],gg=[],bl=[];
    for(let y=by*B;y<Math.min(H,by*B+B);y+=3)for(let x=bx*B;x<Math.min(W,bx*B+B);x+=3){
      const i=(y*W+x)*4;l.push(.299*d[i]+.587*d[i+1]+.114*d[i+2]);
      rr.push(d[i]);gg.push(d[i+1]);bl.push(d[i+2]);
    }
    const qi=Math.max(0,Math.floor(l.length*.96));
    l.sort((a,b)=>a-b);rr.sort((a,b)=>a-b);gg.sort((a,b)=>a-b);bl.sort((a,b)=>a-b);
    const k=by*gw+bx;g[k]=l[qi]||255;br[k]=rr[qi]||255;bg[k]=gg[qi]||255;bb[k]=bl[qi]||255;
  }
  return{g,br,bg,bb,gw,gh,B};
}
function sharpenText(canvas,amount=.48){
  const W=canvas.width,H=canvas.height,ctx=canvas.getContext('2d',{willReadFrequently:true}),image=ctx.getImageData(0,0,W,H),d=image.data,src=new Uint8ClampedArray(d);
  const lum=i=>.299*src[i]+.587*src[i+1]+.114*src[i+2];
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const i=(y*W+x)*4,center=lum(i),around=(lum(i-4)+lum(i+4)+lum(i-W*4)+lum(i+W*4))*.25;
    const edge=center-around,detail=Math.abs(edge)<3.5?0:edge*amount;
    d[i]=clamp(src[i]+detail,0,255);d[i+1]=clamp(src[i+1]+detail,0,255);d[i+2]=clamp(src[i+2]+detail,0,255);
  }
  ctx.putImageData(image,0,0);return canvas;
}
function sharpenMagicText(canvas,amount=.28){
  const W=canvas.width,H=canvas.height,ctx=canvas.getContext('2d',{willReadFrequently:true});
  const image=ctx.getImageData(0,0,W,H),d=image.data,src=new Uint8ClampedArray(d);
  const lum=i=>.299*src[i]+.587*src[i+1]+.114*src[i+2];
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const i=(y*W+x)*4,center=lum(i);
    const left=lum(i-4),right=lum(i+4),up=lum(i-W*4),down=lum(i+W*4);
    const blur=(4*center+2*(left+right+up+down)+lum(i-W*4-4)+lum(i-W*4+4)+lum(i+W*4-4)+lum(i+W*4+4))/16;
    const detail=center-blur;
    const edge=Math.max(Math.abs(center-left),Math.abs(center-right),Math.abs(center-up),Math.abs(center-down));
    const edgeGate=clamp((edge-1.8)/13,0,1);
    const detailGate=clamp((Math.abs(detail)-.8)/4.5,0,1);
    const chroma=Math.max(src[i],src[i+1],src[i+2])-Math.min(src[i],src[i+1],src[i+2]);
    // Sharpen colored marks more gently: their hue and original ink identity remain intact.
    const colorWeight=1-.62*clamp((chroma-10)/32,0,1);
    const delta=clamp(detail*amount*edgeGate*detailGate*colorWeight,-6.5,6.5);
    d[i]=clamp(src[i]+delta,0,255);
    d[i+1]=clamp(src[i+1]+delta,0,255);
    d[i+2]=clamp(src[i+2]+delta,0,255);
  }
  ctx.putImageData(image,0,0);return canvas;
}
function adaptiveBinarize(base){
  const W=base.width,H=base.height,ctx=base.getContext('2d',{willReadFrequently:true});
  const image=ctx.getImageData(0,0,W,H),d=image.data,stride=W+1;
  const lum=new Uint8Array(W*H),integral=new Uint32Array((W+1)*(H+1));
  for(let i=0,j=0;i<d.length;i+=4,j++)lum[j]=.299*d[i]+.587*d[i+1]+.114*d[i+2];
  for(let y=0;y<H;y++){
    let row=0;const line=(y+1)*stride,above=y*stride,src=y*W;
    for(let x=0;x<W;x++){row+=lum[src+x];integral[line+x+1]=integral[above+x+1]+row}
  }
  const radius=Math.max(10,Math.round(Math.min(W,H)*.012));
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const x0=Math.max(0,x-radius),x1=Math.min(W-1,x+radius);
    const y0=Math.max(0,y-radius),y1=Math.min(H-1,y+radius);
    const a=y0*stride+x0,b=y0*stride+x1+1,c=(y1+1)*stride+x0,e=(y1+1)*stride+x1+1;
    const count=(x1-x0+1)*(y1-y0+1),mean=(integral[e]-integral[b]-integral[c]+integral[a])/count;
    const threshold=mean-Math.max(9,mean*.075),v=lum[y*W+x]<threshold?0:255,i=(y*W+x)*4;
    d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;
  }
  const out=mk(W,H);out.getContext('2d').putImageData(image,0,0);return out;
}
function filt(base,type,bgc){
  const W=base.width,H=base.height,o=mk(W,H),x=o.getContext('2d');x.drawImage(base,0,0);
  if(type==='orig')return o;
  if(type==='bw')return adaptiveBinarize(base);
  const id=x.getImageData(0,0,W,H),d=id.data,{g:lumBg,br:bgRGrid,bg:bgGGrid,bb:bgBGrid,gw,gh,B}=bgc;
  // A compact luminance map lets Magic distinguish soft paper shading from
  // the sharp edges of printed letters and coloured marks.
  let lumMap=null;
  if(type==='magic'||type==='pro'||type==='color'){
    lumMap=new Uint8Array(W*H);
    for(let p=0,j=0;p<d.length;p+=4,j++)lumMap[j]=.299*d[p]+.587*d[p+1]+.114*d[p+2];
  }
  for(let y=0;y<H;y++){
    const fy=clamp(y/B-.5,0,gh-1),y0=fy|0,y1=Math.min(gh-1,y0+1),ty=fy-y0;
    for(let xx=0;xx<W;xx++){
      const fx=clamp(xx/B-.5,0,gw-1),x0=fx|0,x1=Math.min(gw-1,x0+1),tx=fx-x0;
      const bg=(lumBg[y0*gw+x0]*(1-tx)+lumBg[y0*gw+x1]*tx)*(1-ty)+(lumBg[y1*gw+x0]*(1-tx)+lumBg[y1*gw+x1]*tx)*ty;
      let bgR=255,bgG=255,bgB=255;
      if(type==='pro'||type==='color'){
        bgR=(bgRGrid[y0*gw+x0]*(1-tx)+bgRGrid[y0*gw+x1]*tx)*(1-ty)+(bgRGrid[y1*gw+x0]*(1-tx)+bgRGrid[y1*gw+x1]*tx)*ty;
        bgG=(bgGGrid[y0*gw+x0]*(1-tx)+bgGGrid[y0*gw+x1]*tx)*(1-ty)+(bgGGrid[y1*gw+x0]*(1-tx)+bgGGrid[y1*gw+x1]*tx)*ty;
        bgB=(bgBGrid[y0*gw+x0]*(1-tx)+bgBGrid[y0*gw+x1]*tx)*(1-ty)+(bgBGrid[y1*gw+x0]*(1-tx)+bgBGrid[y1*gw+x1]*tx)*ty;
      }
      const k=255/Math.max(bg,100),i=(y*W+xx)*4;
      let r=d[i],gg=d[i+1],b=d[i+2];
      if(type==='pro'){
        const rawL=lumMap[y*W+xx],left=lumMap[y*W+Math.max(0,xx-1)],right=lumMap[y*W+Math.min(W-1,xx+1)];
        const up=lumMap[Math.max(0,y-1)*W+xx],down=lumMap[Math.min(H-1,y+1)*W+xx];
        const localMean=(left+right+up+down)*.25;
        const edge=Math.max(Math.abs(rawL-left),Math.abs(rawL-right),Math.abs(rawL-up),Math.abs(rawL-down));
        const nr=clamp(r*255/Math.max(bgR,90),0,255),ng=clamp(gg*255/Math.max(bgG,90),0,255),nb=clamp(b*255/Math.max(bgB,90),0,255);
        const normalizedL=.299*nr+.587*ng+.114*nb;
        const ratio=rawL/Math.max(bg,90);
        const denoise=.12*(1-clamp((Math.abs(rawL-localMean)-3)/14,0,1));
        const cleanL=clamp(normalizedL+(localMean-rawL)*denoise*255/Math.max(bg,90),0,255);
        const v=cleanL/255;
        const bgChroma=Math.max(bgR,bgG,bgB)-Math.min(bgR,bgG,bgB);
        const pixelChroma=Math.max(r,gg,b)-Math.min(r,gg,b);
        const colorInk=clamp((pixelChroma-bgChroma-10)/38,0,1);
        const inkGuard=clamp((.84-ratio)/.38,0,1);
        const edgeGuard=clamp((edge-5)/30,0,1);
        const paperTarget=255*(1-Math.pow(1-v,2.35));
        const paperBlend=.88*(1-edgeGuard)*(1-inkGuard)*(1-colorInk*.88);
        let targetL=clamp(cleanL+(paperTarget-cleanL)*paperBlend,0,255);
        // Darken neutral printed ink separately from the paper correction.
        // The background-relative mask catches faded grey text, while the
        // chroma guard keeps colored stamps and annotations from turning muddy.
        const neutralInk=1-colorInk*.94;
        const inkDensity=clamp((.96-ratio)/.62,0,1)*neutralInk;
        const edgeInk=clamp((localMean-rawL-1)/22,0,1);
        const inkDarken=(9+17*edgeInk)*inkDensity;
        targetL=clamp(targetL-inkDarken,0,255);
        const colorMix=colorInk*.86,delta=targetL-cleanL;
        r=clamp((nr+delta)*(1-colorMix)+r*colorMix,0,255);
        gg=clamp((ng+delta)*(1-colorMix)+gg*colorMix,0,255);
        b=clamp((nb+delta)*(1-colorMix)+b*colorMix,0,255);
      }else if(type==='color'){

        // while protecting colored stamps, signatures and text edges.

// Decode and downsize imports before opening the editor. This caps memory use on

function hideBusy(){$('#busy').hidden=true}
async function decodeImageFile(file){
  let bitmap=null;
  if(window.createImageBitmap){
    try{bitmap=await createImageBitmap(file,{imageOrientation:'from-image'})}
    catch(e){try{bitmap=await createImageBitmap(file)}catch(e2){bitmap=null}}
  }
  let width,height,draw;
  if(bitmap){width=bitmap.width;height=bitmap.height;draw=(ctx,w,h)=>ctx.drawImage(bitmap,0,0,w,h)}
  else{
    const url=URL.createObjectURL(file),img=new Image();
    try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Image could not be decoded'));img.src=url})}
    finally{URL.revokeObjectURL(url)}
    width=img.naturalWidth;height=img.naturalHeight;draw=(ctx,w,h)=>ctx.drawImage(img,0,0,w,h);
  }
  if(!width||!height)throw new Error('Image has invalid dimensions');
  const scale=Math.min(1,3200/Math.max(width,height),Math.sqrt(10000000/(width*height)));
  const w=Math.max(1,Math.round(width*scale)),h=Math.max(1,Math.round(height*scale));
  const canvas=mk(w,h),ctx=canvas.getContext('2d',{alpha:false});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);draw(ctx,w,h);
  if(bitmap&&bitmap.close)bitmap.close();

}
function queueFiles(fileList){
  const incoming=[...fileList],images=incoming.filter(f=>f.type&&f.type.startsWith('image/'));
  if(!images.length){alert('Please select JPG, PNG or WEBP image files.');return}
  const skipped=incoming.length-images.length;
  const startNow=Q.length===0;
  Q.push(...images);importTotal+=images.length;
  if(skipped)alert(skipped+' non-image file(s) were skipped.');
  if(startNow)nextFile();
}
$('#fIn').onchange=e=>{queueFiles(e.target.files);e.target.value=''};
async function nextFile(){
  if(!Q.length){hideBusy();return}
  const f=Q.shift();importDone++;
  showBusy('Loading '+f.name+' ('+importDone+' of '+importTotal+')…');
  await nextFrame();
  try{
    const canvas=await decodeImageFile(f);
    showBusy('Opening image editor…');await nextFrame();
    hideBusy();addSrc(canvas);
  }catch(err){
    console.error('Image import failed:',err);
    alert('Could not open "'+f.name+'". The file may be damaged or unsupported.');
    if(Q.length)nextFile();else hideBusy();
  }
}

}

/* ---------- editor ---------- */
function openEd(pg,isNew,mode){
  pg.adjustments={brightness:0,shadows:0,highlights:0,contrast:0,paper:0,sharpness:0,...(pg.adjustments||{})};
  ed={pg,isNew,mode,drag:-1,sc:1,zoom:1};show('edit');
  if(mode==='crop'&&!pg.quad)pg.quad=inset(pg.src);
  if(mode==='filter'){pg.filtered=pg.filter==='clean'?cleanDocument(pg.base,pg.bgc):filt(pg.base,pg.filter,pg.bgc);renderAdjustedPg(pg)}
  ui();draw();
}
function updateAdjustmentControls(pg){
  for(const key of ['brightness','shadows','highlights','contrast','paper','sharpness']){
    const value=Number(pg.adjustments[key])||0,input=$(`[data-adjust="${key}"]`),output=$(`[data-adjust-value="${key}"]`);
    if(input)input.value=value;
    if(output)output.textContent=value>0?'+'+value:String(value);
  }
}

  const pg=ed.pg,crop=ed.mode==='crop';
  $('#eTitle').textContent=crop?'Adjust corners':'Choose filter';$('#eNext').textContent=crop?'Next ›':'Done ✓';
  $('#adjustPanel').classList.toggle('visible',!crop);

   :['orig:Original','color:Color','clean:Clean','magic:Magic','pro:Magic Pro','bw:B&W','gray:Grayscale'].map(s=>{const[k,l]=s.split(':');return`<button class="chip${pg.filter===k?' on':''}" data-f="${k}">${l}</button>`}).join('')+'<button id="tRot">↻ Rotate</button><button id="tCrop">✂ Re-crop</button>';
}

    try{
      const context=canvas.getContext('2d',{willReadFrequently:true});
      const pixels=context.getImageData(0,0,width,height).data;
      const rgb=new Uint8Array(width*height*3);
      let target=0;
      for(let y=0;y<height;y++){
        const rowStart=y*width*4,rowEnd=rowStart+width*4;
        for(let source=rowStart;source<rowEnd;source+=4){
          rgb[target++]=pixels[source];rgb[target++]=pixels[source+1];rgb[target++]=pixels[source+2];
        }
        if(y&&y%120===0)await nextFrame();
      }
      const compressed=await new Response(new Blob([rgb]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer();
      return {bytes:new Uint8Array(compressed),filter:'FlateDecode',width:width,height:height};
    }catch(error){
      console.warn('Lossless PDF compression unavailable; using high-quality JPEG for this page.',error);
    }
  }
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Could not encode a scanned page.')),'image/jpeg',.98));
  return {bytes:new Uint8Array(await blob.arrayBuffer()),filter:'DCTDecode',width:width,height:height};
}
function buildPdfBlob(encodedPages){
  const objects=[];
  const addObject=body=>{objects.push(typeof body==='string'?pdfAscii(body):body);return objects.length};
  const catalogId=addObject('<< /Type /Catalog /Pages 2 0 R >>');
  const pagesId=addObject('');
  const pageIds=[];
  encodedPages.forEach((image,index)=>{
    const portrait=image.width>=image.height?false:true;
    const pageWidth=portrait?595.28:841.89,pageHeight=portrait?841.89:595.28;
    const scale=Math.min(pageWidth/image.width,pageHeight/image.height);
    const drawWidth=image.width*scale,drawHeight=image.height*scale;
    const left=(pageWidth-drawWidth)/2,bottom=(pageHeight-drawHeight)/2;
    const imageId=objects.length+1;
    const imageHeader='<< /Type /XObject /Subtype /Image /Width '+image.width+' /Height '+image.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /'+image.filter+' /Length '+image.bytes.length+' >>\nstream\n';
    addObject(pdfJoin([pdfAscii(imageHeader),image.bytes,pdfAscii('\nendstream')]));
    const content='q\n'+drawWidth.toFixed(3)+' 0 0 '+drawHeight.toFixed(3)+' '+left.toFixed(3)+' '+bottom.toFixed(3)+' cm\n/Im0 Do\nQ';
    const contentId=addObject('<< /Length '+pdfAscii(content).length+' >>\nstream\n'+content+'\nendstream');
    const pageId=addObject('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+pageWidth+' '+pageHeight+'] /Resources << /XObject << /Im0 '+imageId+' 0 R >> >> /Contents '+contentId+' 0 R >>');
    pageIds.push(pageId);
  });
  objects[pagesId-1]=pdfAscii('<< /Type /Pages /Kids ['+pageIds.map(id=>id+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
  const chunks=[pdfAscii('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')],offsets=[0];
  let position=chunks[0].length;
  objects.forEach((body,index)=>{
    offsets.push(position);
    const prefix=pdfAscii((index+1)+' 0 obj\n'),suffix=pdfAscii('\nendobj\n');
    chunks.push(prefix,body,suffix);position+=prefix.length+body.length+suffix.length;
  });
  const xrefPosition=position;
  const xref='xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n'+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('');
  const trailer='trailer\n<< /Size '+(objects.length+1)+' /Root '+catalogId+' 0 R >>\nstartxref\n'+xrefPosition+'\n%%EOF';
  chunks.push(pdfAscii(xref),pdfAscii(trailer));
  return new Blob(chunks,{type:'application/pdf'});
}
function downloadPdf(blob,name){
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=name;link.style.display='none';document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}
async function exportPdfPages(selectedPages){
  const button=$('#bPdf'),selectedButton=$('#exportSelected');
  if(!Array.isArray(selectedPages)||!selectedPages.length){alert('Select at least one page to export.');return}
  button.disabled=true;if(selectedButton)selectedButton.disabled=true;
  try{
    const encoded=[];
    for(let i=0;i<selectedPages.length;i++){
      const page=selectedPages[i];
      if(!page?.out||typeof page.out.toBlob!=='function')throw new Error('Page '+(i+1)+' is not ready. Open the page, press Done, then export again.');
      showBusy('Preparing PDF page '+(i+1)+' of '+selectedPages.length+'…');await nextFrame();
      const lossless=['bw','gray','clean','magic','pro'].includes(page.filter);
      encoded.push(await pdfImageStream(page.out,lossless));
    }
    showBusy('Building PDF file…');await nextFrame();
    const blob=buildPdfBlob(encoded);
    if(!blob.size)throw new Error('The PDF file could not be assembled.');
    showBusy('Saving PDF…');await nextFrame();
    downloadPdf(blob,pdfSafeName($('#fn').value)+'.pdf');
    toast('PDF exported · '+selectedPages.length+' page(s)');
  }catch(error){
    console.error('Scanner PDF export failed:',error);
    alert('PDF export failed: '+(error?.message||'Unexpected error. Please retry.'));
  }finally{
    hideBusy();button.disabled=false;if(selectedButton)selectedButton.disabled=false;
  }
}
$('#bPdf').onclick=()=>{
  if(!pages.length)return alert('Add a page first.');
  if(pages.length===1){exportPdfPages(pages);return}
  $('#exportPageList').innerHTML=pages.map((p,i)=>'<label class="export-row"><input type="checkbox" data-export-index="'+i+'" checked><img src="'+p.th+'" alt="Page '+(i+1)+'"><span>Page '+(i+1)+'</span></label>').join('');
  $('#exportToggleAll').textContent='Deselect all';
  const dialog=$('#exportDlg');
  if(typeof dialog.showModal==='function')dialog.showModal();
  else if(confirm('Export all '+pages.length+' pages as one PDF?'))exportPdfPages(pages);
};
$('#exportToggleAll').onclick=()=>{
  const boxes=[...$('#exportPageList').querySelectorAll('input[type="checkbox"]')],select=boxes.some(b=>!b.checked);
  boxes.forEach(b=>b.checked=select);
  $('#exportToggleAll').textContent=select?'Deselect all':'Select all';
};
$('#exportCancel').onclick=()=>$('#exportDlg').close();
$('#exportSelected').onclick=async()=>{
  const indexes=[...$('#exportPageList').querySelectorAll('input[type="checkbox"]:checked')].map(b=>+b.dataset.exportIndex);
  if(!indexes.length)return alert('Select at least one page to export.');
  $('#exportDlg').close();
  await exportPdfPages(indexes.map(i=>pages[i]));
};
$('#bOcr').onclick=async()=>{
  if(!pages.length)return alert('Add a page first.');
  const ta=$('#ocrT');ta.value='Reading text… (the first run downloads language data)';$('#dlg').showModal();
  try{
    if(!window.Tesseract)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
    const w=await Tesseract.createWorker('eng+ben');let t='';
    for(let i=0;i<pages.length;i++){const r=await w.recognize(pages[i].out);t+=(pages.length>1?'--- Page '+(i+1)+' ---\n':'')+r.data.text+'\n';ta.value=t}
    await w.terminate();ta.value=t.trim();
  }catch(e){ta.value='Text recognition could not run. Check your internet connection.'}
};
$('#oClose').onclick=()=>$('#dlg').close();
$('#oCopy').onclick=()=>navigator.clipboard.writeText($('#ocrT').value);
$('#oDl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#ocrT').value],{type:'text/plain'}));a.download=($('#fn').value||'Scan')+'.txt';a.click()};
grid();
</script>
