name: Build Face Swap Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:
    paths:
      - "face-swap.html"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-face-swap.mjs"
      - ".github/workflows/build-face-swap.yml"
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Build self-hosted Face Swap engine
        run: npm run build:face-swap

      - name: Commit generated engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/face-swap
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: self-host Face Swap engine [skip ci]"
          git push origin HEAD:main
