name: Deploy DocuWorks Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.jsonc
      - functions/api/assistant.js
      - functions/api/convert.js
      - .github/workflows/deploy-cloudflare-worker.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: docuworks-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Cloudflare deployment credentials
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ACCOUNT_ID}" ]; then
            echo "::error::Cloudflare deployment credentials are missing. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Cloudflare deployment credentials are present."

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed URS-to-CS converter build
        id: verify-converter
        run: |
          set -euo pipefail
          EXPECTED_BUILD="$(node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('functions/api/convert.js', 'utf8');
          const marker = 'build:"';
          const start = source.indexOf(marker);
          const end = start < 0 ? -1 : source.indexOf('"', start + marker.length);
          if (start < 0 || end < 0) {
            console.error('Could not identify the converter build identifier in functions/api/convert.js');
            process.exit(1);
          }
          process.stdout.write(source.slice(start + marker.length, end));
          NODE
          )"
          HEALTH_URL="https://docuworks-studio.shuvokh97.workers.dev/api/convert"
          echo "Expected converter build: ${EXPECTED_BUILD}"
          echo "Checking live Worker: ${HEALTH_URL}"

          verified=false
          for attempt in $(seq 1 24); do
            if response="$(curl --silent --show-error --fail --max-time 20 "${HEALTH_URL}")"; then
              if RESPONSE_JSON="${response}" EXPECTED_BUILD="${EXPECTED_BUILD}" node - <<'NODE'
          let data;
          try {
            data = JSON.parse(process.env.RESPONSE_JSON || '');
          } catch {
            console.error('Worker health endpoint did not return valid JSON.');
            process.exit(1);
          }
          const expected = process.env.EXPECTED_BUILD;
          const actual = data?.diagnostic?.build || 'missing';
          const ok = data?.status === 'ok' &&
            data?.configured === true &&
            data?.diagnostic?.workersAIBindingPresent === true &&
            actual === expected;
          console.log(JSON.stringify({
            status: data?.status,
            configured: data?.configured,
            workersAIBindingPresent: data?.diagnostic?.workersAIBindingPresent,
            expectedBuild: expected,
            liveBuild: actual,
            verified: ok
          }, null, 2));
          process.exit(ok ? 0 : 1);
          NODE
              then
                verified=true
                break
              fi
            fi
            echo "Attempt ${attempt}/24: the live Worker is not yet reporting the expected build. Retrying in 5 seconds..."
            sleep 5
          done

          if [ "${verified}" != "true" ]; then
            echo "::error::Deployment verification failed. The live Worker did not report the source build and active AI binding. The deployment must not be considered successful."
            exit 1
          fi

          {
            echo "## Cloudflare Worker deployment verified"
            echo ""
            echo "- **Worker:** docuworks-studio"
            echo "- **Converter build:** ${EXPECTED_BUILD}"
            echo "- **AI binding:** active"
            echo "- **Health endpoint:** ${HEALTH_URL}"
            echo "- **Source commit:** ${GITHUB_SHA}"
            echo "- **Result:** live Worker matches the build in this commit"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify deployed AI Agent backend
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error https://docuworks-studio.shuvokh97.workers.dev/api/assistant)"
          echo "$response"
          echo "$response" | grep -q '"agentMode":true'
          echo "$response" | grep -q '"agentBuild":"2026-11-16-agent-v1"'

      - name: Verify download proxy route
        run: |
          set -euo pipefail
          status="$(curl --silent --output /tmp/download-proxy-check.json --write-out '%{http_code}' 'https://docuworks-studio.shuvokh97.workers.dev/api/download')"
          test "$status" = "400"
          grep -q 'Missing file URL' /tmp/download-proxy-check.json

      - name: Publish deployment result to the source commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "${JOB_STATUS}" = "success" ]; then
            STATE="success"
            BUILD="$(node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('functions/api/convert.js', 'utf8');
          const marker = 'build:"';
          const start = source.indexOf(marker);
          const end = start < 0 ? -1 : source.indexOf('"', start + marker.length);
          if (start < 0 || end < 0) process.exit(1);
          process.stdout.write(source.slice(start + marker.length, end));
          NODE
          )"
            DESCRIPTION="Live Worker verified: ${BUILD}"
          else
            STATE="failure"
            DESCRIPTION="Cloudflare deployment or live Worker verification failed"
          fi

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${STATE}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="${DESCRIPTION}" \
            -f context="cloudflare/production" >/dev/null

          echo "Published ${STATE} deployment status to ${GITHUB_SHA}."
