name: DocuWorks AI agent regression

on:
  push:
    branches:
      - main
      - feature/docuworks-ai-agent
    paths:
      - agent-tools.js
      - ai-assistant.js
      - functions/api/assistant.js
      - project360.html
      - .github/tests/ai-agent.test.cjs
      - .github/workflows/ai-agent-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-agent-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run agent regression tests
        run: node --test .github/tests/ai-agent.test.cjs
