name: Clear stale GitHub Pages deployment

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read
  deployments: write

concurrency:
  group: clear-stale-github-pages
  cancel-in-progress: false

jobs:
  clear-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale GitHub Pages builds
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, branch: "main", per_page: 30 }
            );
            const staleRuns = runs.filter(run =>
              run.name === "pages build and deployment" &&
              run.status === "in_progress" &&
              run.head_sha !== context.sha
            );
            for (const run of staleRuns) {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              core.info("Cancelled stale Pages build " + run.id + " for " + run.head_sha + ".");
            }
            if (!staleRuns.length) core.info("No stale in-progress Pages builds found.");
      - name: Mark known stale Pages deployment inactive
        uses: actions/github-script@v7
        with:
          script: |
            const staleShas = [
              "c2deef35fc714135c112a8169ed4ac28c2603797",
              "6e86143b16fa25bc767093887e31808dccf1c3ba"
            ];
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const stale = deployments.filter(d =>
              staleShas.includes(d.sha) && d.environment === "github-pages"
            );
            for (const deployment of stale) {
              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner: context.repo.owner, repo: context.repo.repo,
                deployment_id: deployment.id, per_page: 1
              });
              const latest = statuses.data[0];
              if (latest && !["inactive","failure","error"].includes(latest.state)) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner, repo: context.repo.repo,
                  deployment_id: deployment.id, state: "inactive",
                  description: "Closing a stale Pages deployment to unblock the latest website build."
                });
                core.info("Closed stale deployment " + deployment.id + ".");
              }
            }
