name: Clear stale GitHub Pages deployment

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: clear-stale-github-pages
  cancel-in-progress: false

jobs:
  clear-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale Pages deployment inactive
        uses: actions/github-script@v7
        with:
          script: |
            const staleSha = "c2deef35fc714135c112a8169ed4ac28c2603797";
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const stale = deployments.filter(d =>
              d.sha === staleSha && d.environment === "github-pages"
            );
            if (!stale.length) {
              core.warning("No stale github-pages deployment was returned for " + staleSha + ".");
            }
            for (const deployment of stale) {
              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                per_page: 1
              });
              const latest = statuses.data[0];
              if (latest && ["in_progress", "queued", "pending"].includes(latest.state)) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: "inactive",
                  description: "Closing a stale Pages deployment to unblock the latest website build."
                });
                core.info("Closed stale deployment " + deployment.id + ".");
              } else {
                core.info("Deployment " + deployment.id + " is already " + (latest ? latest.state : "without status") + ".");
              }
            }
