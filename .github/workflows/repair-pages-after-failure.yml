name: Repair stale GitHub Pages deployment

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: github-pages-recovery
  cancel-in-progress: false

jobs:
  recover-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the failed Pages build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Close the stale Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const staleSha = "c2deef35fc714135c112a8169ed4ac28c2603797";
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner: context.repo.owner, repo: context.repo.repo, environment: "github-pages", per_page: 100 }
            );
            const stale = deployments.filter(d => d.sha === staleSha);
            if (!stale.length) {
              core.warning("The known stale deployment was not returned by the GitHub Pages deployment list.");
            }
            for (const deployment of stale) {
              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner: context.repo.owner, repo: context.repo.repo,
                deployment_id: deployment.id, per_page: 1
              });
              const latest = statuses.data[0];
              if (latest && ["in_progress", "queued", "pending"].includes(latest.state)) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner, repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: "inactive",
                  description: "Close stale deployment so the latest DocuWorks Pages build can publish."
                });
                core.info("Marked stale deployment " + deployment.id + " inactive.");
              } else {
                core.info("Stale deployment " + deployment.id + " is already inactive or complete.");
              }
            }

      - name: Build the website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy the latest website
        id: deployment
        uses: actions/deploy-pages@v5
