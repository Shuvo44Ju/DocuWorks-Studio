<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14243d"><title>Quotation Comparison – DocuWorks Studio</title>
<style>
:root{--navy:#14243d;--line:#dbe3ee;--green:#dcfce7}*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,"Segoe UI","Nirmala UI","Noto Sans Bengali",sans-serif;background:#f3f6fa;color:var(--navy)}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}header a{color:#5eead4;text-decoration:none}h1{font-size:18px;margin:0}
main{max-width:1250px;margin:18px auto;padding:0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{font-size:12px;color:#51617a;display:block}
input,select{font:inherit;padding:7px 8px;border:1px solid #c5d0df;border-radius:7px;background:#fff;color:inherit;max-width:100%}
/* Compact manufacturer comparison layout */
#table thead th{padding:5px 7px;min-width:185px;line-height:1.25}#table thead th:first-child{min-width:90px;width:90px}#table thead th label{font-size:10px;line-height:1.15;margin:2px 0 1px;color:#51617a}#table thead th input,#table thead th select{padding:4px 6px;margin:0 0 3px;min-height:28px;font-size:12px;line-height:1.2}#table thead th button{padding:3px 7px;font-size:11px;line-height:1.2;margin-top:2px}#table td{padding:4px 6px}#table td input{padding:4px 6px;margin:0;min-height:28px}#table td small{display:block;line-height:1.1;margin-top:1px}#table .line-subtotal td{background:#f8fafc;color:#334155;font-size:12px;padding-top:3px;padding-bottom:3px}#table .line-subtotal td:first-child{font-weight:600}
button{font:inherit;padding:7px 12px;border:0;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer}button.secondary{background:#e6edf6;color:var(--navy)}button.remove{background:transparent;color:#b42318;padding:2px 6px}
.wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:640px}td,th{border:1px solid var(--line);padding:6px;vertical-align:top}th{background:#eef3f9;font-size:12px;text-align:left}td input,th input,th select{width:100%;margin-bottom:4px}.num{text-align:right}
tfoot td{font-weight:700;background:#f8fafc}.lowest{background:var(--green)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.vendor-card{border:1px solid var(--line);border-radius:12px;padding:12px}.vendor-card.best{border-color:#16a34a;background:#f0fdf4}.total{font-size:20px;font-weight:700}.muted{font-size:12px;color:#51617a}.badge{display:inline-block;background:#16a34a;color:#fff;border-radius:99px;padding:1px 9px;font-size:11px;margin-left:6px}
@media print{.no-print,header{display:none!important}body{background:#fff}.card{border:0;padding:0}input,select{border:0;padding:0;appearance:none;background:transparent}}
</style></head>
<body><header><h1>Quotation Comparison</h1><a href="index.html">← DocuWorks Studio</a></header>
<main>
<div class="card no-print">
<h3 style="margin:0 0 10px">Item Details</h3>
<div class="wrap"><table id="itemTable"></table></div>
<div class="row" style="margin-top:12px">
<div><label>Currency</label><select id="currency">
<option value="BDT">BDT (৳)</option><option value="USD">USD ($)</option><option value="GBP">GBP (£)</option><option value="EUR">EUR (€)</option><option value="CHF">CHF</option><option value="INR">INR (₹)</option><option value="CNY">CNY (¥)</option><option value="JPY">JPY (¥)</option><option value="CAD">CAD ($)</option><option value="AUD">AUD ($)</option><option value="AED">AED (د.إ)</option>
</select></div>
<div id="vatWrap"><label>VAT (%)</label><input id="vat" type="number" min="0" step="0.01" style="width:90px"></div>
<button class="secondary" id="addItem">+ Item</button><button class="secondary" id="addVendor">+ Vendor</button><button id="export">Download Excel</button><button class="secondary" id="clear">Clear all</button>
</div>
</div>
<div class="card"><h3 style="margin:0 0 8px">Manufacturer Comparison</h3><div class="wrap"><table id="table"></table></div></div>
<div class="card"><h3 style="margin:0 0 8px">Result</h3><div class="cards" id="results"></div></div>
<div class="card"><h3 style="margin:0 0 8px">Comments</h3><div class="cards" id="comments"></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var symbols={BDT:'৳',USD:'$',GBP:'£',EUR:'€',CHF:'CHF',INR:'₹',CNY:'¥',JPY:'¥',CAD:'$',AUD:'$',AED:'د.إ'};
var saved=null;try{saved=JSON.parse(localStorage.getItem('dw-quote')||'null');}catch(e){}
var state=saved||{area:'',cerNumber:'',currency:'BDT',vat:15,vendors:[{manufacturer:'',localAgent:'Vendor A',origin:'',model:'',freight:0},{manufacturer:'',localAgent:'Vendor B',origin:'',model:'',freight:0},{manufacturer:'',localAgent:'Vendor C',origin:'',model:'',freight:0}],items:[{name:'',qty:1,unit:'pcs',prices:[0,0,0]}]};
if(!symbols[state.currency])state.currency='BDT';
if(state.area===undefined)state.area='';if(state.cerNumber===undefined)state.cerNumber='';
state.vendors=state.vendors||[];
state.items=state.items||[];
state.vendors.forEach(function(v){if(v.localAgent===undefined)v.localAgent=v.name||v.n||'Vendor';if(v.manufacturer===undefined)v.manufacturer='';if(v.origin===undefined)v.origin='';if(v.model===undefined)v.model='';if(v.comments===undefined)v.comments='';if(v.freight===undefined)v.freight=0;if(v.incl===undefined)v.incl=0;});
state.items.forEach(function(it){if(it.name===undefined)it.name=it.n||'';if(it.qty===undefined)it.qty=it.q||1;if(it.unit===undefined)it.unit=it.u||'pcs';if(!Array.isArray(it.prices))it.prices=it.p||[];while(it.prices.length<state.vendors.length)it.prices.push(0);});
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(n){return (+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function isBDT(){return state.currency==='BDT';}
function money(n){return (symbols[state.currency]||state.currency)+' '+fmt(n);}
function totals(){return state.vendors.map(function(v,j){var raw=state.items.reduce(function(sum,it){return sum+(+it.qty||0)*(+it.prices[j]||0);},0);var rate=(+state.vat||0)/100;var subtotal=isBDT()&&v.incl?raw/(1+rate):raw;var vat=isBDT()?(v.incl?raw-subtotal:subtotal*rate):0;var freight=isBDT()?0:(+v.freight||0);return {subtotal:subtotal,vat:vat,freight:freight,total:Math.round((subtotal+vat+freight)*100)/100};});}
function persist(){try{localStorage.setItem('dw-quote',JSON.stringify(state));}catch(e){}}
function render(){
  $('#currency').value=state.currency;$('#vat').value=state.vat;
  $('#vatWrap').style.display=isBDT()?'':'none';
  var itemHtml='<thead><tr><th style="min-width:180px">Item / description</th><th style="width:65px">Qty</th><th style="width:75px">Unit</th><th style="min-width:125px">Area</th><th style="min-width:125px">CER Number</th><th class="no-print"></th></tr></thead><tbody>';
  state.items.forEach(function(it,i){itemHtml+='<tr><td><input data-item-name="'+i+'" value="'+esc(it.name)+'" placeholder="Item / description"></td><td><input type="number" min="0" step="any" data-qty="'+i+'" value="'+it.qty+'"></td><td><input data-unit="'+i+'" value="'+esc(it.unit)+'"></td><td>'+(i===0?'<input id="area" value="'+esc(state.area||'')+'" placeholder="Enter area">':'')+'</td><td>'+(i===0?'<input id="cerNumber" value="'+esc(state.cerNumber||'')+'" placeholder="CER Number">':'')+'</td><td class="no-print"><button class="remove" data-remove-item="'+i+'">×</button></td></tr>';});
  itemHtml+='</tbody>';$('#itemTable').innerHTML=itemHtml;
  var html='<thead><tr><th style="min-width:180px"></th>';
  state.vendors.forEach(function(v,j){html+='<th style="min-width:205px"><label>Manufacturer name</label><input data-vmanufacturer="'+j+'" value="'+esc(v.manufacturer)+'" placeholder="Manufacturer name"><label>Local agent</label><input data-vagent="'+j+'" value="'+esc(v.localAgent)+'" placeholder="Local agent"><label>Origin</label><input data-vorigin="'+j+'" value="'+esc(v.origin)+'" placeholder="Country of origin"><label>Model</label><input data-vmodel="'+j+'" value="'+esc(v.model)+'" placeholder="Model">';if(isBDT())html+='<label>Price basis</label><select data-incl="'+j+'"><option value="0"'+(!v.incl?' selected':'')+'>Prices excl. VAT</option><option value="1"'+(v.incl?' selected':'')+'>Prices incl. VAT</option></select>';else html+='<label>Freight ('+esc(state.currency)+')</label><input type="number" min="0" step="any" data-freight="'+j+'" value="'+(v.freight||'')+'" placeholder="Enter freight">';html+='<button class="remove no-print" data-remove-vendor="'+j+'" title="Remove vendor">Remove</button></th>';});
  html+='</tr></thead><tbody>';
  state.items.forEach(function(it,i){html+='<tr><td><b data-item-label="'+i+'">'+esc(it.name||('Item '+(i+1)))+'</b><div class="muted">Unit price</div></td>';state.vendors.forEach(function(v,j){html+='<td><input type="number" min="0" step="any" class="num" data-price="'+i+','+j+'" value="'+(it.prices[j]||'')+'"></td>';});html+='</tr><tr class="line-subtotal"><td><b data-subtotal-label="'+i+'">Subtotal — '+esc(it.name||('Item '+(i+1)))+'</b></td>';state.vendors.forEach(function(){html+='<td class="num" data-line-subtotal="'+i+'"></td>';});html+='</tr>';});
  html+='</tbody><tfoot>';var footerLabels=isBDT()?['Subtotal','VAT','Grand total']:['Subtotal','Freight','Grand total'];footerLabels.forEach(function(label){html+='<tr><td>'+label+'</td>';state.vendors.forEach(function(){html+='<td class="num"></td>';});html+='</tr>';});html+='</tfoot>';
  $('#table').innerHTML=html;calculate();
}
function calculate(){
  var table=$('#table'),ts=totals(),valid=ts.map(function(x){return x.total;}).filter(function(x){return x>0;}),min=valid.length?Math.min.apply(null,valid):null,max=valid.length?Math.max.apply(null,valid):null;
  state.items.forEach(function(it,i){var itemLabel=table.querySelector('[data-item-label="'+i+'"]'),subtotalLabel=table.querySelector('[data-subtotal-label="'+i+'"]'),displayName=it.name&&it.name.trim()?it.name.trim():'Item '+(i+1);if(itemLabel)itemLabel.textContent=displayName;if(subtotalLabel)subtotalLabel.textContent='Subtotal — '+displayName;state.vendors.forEach(function(v,j){var cell=table.tBodies[0].rows[i*2].cells[1+j],subtotalCell=table.tBodies[0].rows[i*2+1].cells[1+j];cell.classList.remove('lowest');var p=+it.prices[j]||0;subtotalCell.textContent=fmt(p*(+it.qty||0));var prices=state.vendors.map(function(vv,k){var q=+it.prices[k]||0;return q>0?(isBDT()&&vv.incl?q/(1+(+state.vat||0)/100):q):null;}).filter(function(x){return x!==null;});var compare=isBDT()&&v.incl?p/(1+(+state.vat||0)/100):p;if(p>0&&prices.length>1&&compare===Math.min.apply(null,prices))cell.classList.add('lowest');});});
  ts.forEach(function(x,j){var subtotalRow=0,extraRow=1,totalRow=2;table.tFoot.rows[subtotalRow].cells[1+j].textContent=fmt(x.subtotal);table.tFoot.rows[extraRow].cells[1+j].textContent=isBDT()?fmt(x.vat):fmt(x.freight);table.tFoot.rows[totalRow].cells[1+j].textContent=fmt(x.total);if(min!==null&&x.total>0&&x.total===min)table.tFoot.rows[totalRow].cells[1+j].classList.add('lowest');else table.tFoot.rows[totalRow].cells[1+j].classList.remove('lowest');});
  $('#results').innerHTML=state.vendors.map(function(v,j){var x=ts[j],best=min!==null&&x.total>0&&x.total===min;return '<div class="vendor-card'+(best?' best':'')+'"><b>'+esc(v.manufacturer||'Manufacturer not entered')+'</b><div class="muted">Local agent: '+esc(v.localAgent||'—')+'<br>Origin: '+esc(v.origin||'—')+'<br>Model: '+esc(v.model||'—')+'</div>'+(best?'<span class="badge">Lowest</span>':'')+'<div class="total">'+money(x.total)+'</div></div>';}).join('');
  $('#comments').innerHTML=state.vendors.map(function(v,j){return '<div class="vendor-card"><b>'+esc(v.manufacturer||v.localAgent||('Vendor '+(j+1)))+'</b><label style="margin-top:10px">Comments</label><textarea data-comment="'+j+'" rows="3" style="width:100%;resize:vertical" placeholder="Enter comments for this manufacturer">'+esc(v.comments||'')+'</textarea></div>';}).join('');
  persist();
}
$('#itemTable').addEventListener('input',function(e){if(e.target.id==='area'){state.area=e.target.value;calculate();}else if(e.target.id==='cerNumber'){state.cerNumber=e.target.value;calculate();}});
$('#currency').addEventListener('change',function(e){state.currency=e.target.value;render();});
$('#vat').addEventListener('input',function(e){state.vat=+e.target.value||0;calculate();});
$('#comments').addEventListener('input',function(e){var j=e.target.dataset.comment;if(j!==undefined){state.vendors[+j].comments=e.target.value;persist();}});
$('#itemTable').addEventListener('input',function(e){var el=e.target,d=el.dataset;if(d.itemName!==undefined)state.items[+d.itemName].name=el.value;else if(d.qty!==undefined)state.items[+d.qty].qty=+el.value||0;else if(d.unit!==undefined)state.items[+d.unit].unit=el.value;calculate();});
$('#table').addEventListener('input',function(e){var el=e.target,d=el.dataset;if(d.vmanufacturer!==undefined)state.vendors[+d.vmanufacturer].manufacturer=el.value;else if(d.vagent!==undefined)state.vendors[+d.vagent].localAgent=el.value;else if(d.vorigin!==undefined)state.vendors[+d.vorigin].origin=el.value;else if(d.vmodel!==undefined)state.vendors[+d.vmodel].model=el.value;else if(d.incl!==undefined)state.vendors[+d.incl].incl=+el.value;else if(d.freight!==undefined)state.vendors[+d.freight].freight=+el.value||0;else if(d.price!==undefined){var a=d.price.split(',');state.items[+a[0]].prices[+a[1]]=+el.value||0;}calculate();});
$('#itemTable').addEventListener('click',function(e){var d=e.target.dataset;if(d.removeItem!==undefined&&state.items.length>1){state.items.splice(+d.removeItem,1);render();}});
$('#table').addEventListener('click',function(e){var d=e.target.dataset;if(d.removeVendor!==undefined&&state.vendors.length>1){var j=+d.removeVendor;state.vendors.splice(j,1);state.items.forEach(function(it){it.prices.splice(j,1);});render();}});
$('#addItem').onclick=function(){state.items.push({name:'',qty:1,unit:'pcs',prices:state.vendors.map(function(){return 0;})});render();};
$('#addVendor').onclick=function(){if(state.vendors.length>=8){alert('Maximum 8 vendors.');return;}state.vendors.push({manufacturer:'',localAgent:'Local agent '+String.fromCharCode(65+state.vendors.length),origin:'',model:'',freight:0,incl:0});state.items.forEach(function(it){it.prices.push(0);});render();};
$('#clear').onclick=function(){if(confirm('Clear all quotation data from this browser?')){localStorage.removeItem('dw-quote');location.reload();}};
$('#export').onclick=async function(){
  if(!window.ExcelJS){alert('Excel export library did not load. Check your internet connection.');return;}
  var wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Comparison'),ts=totals();
  var titleRow=ws.addRow(['Item / description: '+((state.items[0]&&state.items[0].name.trim())||'—'),'Area: '+(state.area||'—'),'CER Number: '+(state.cerNumber||'—')]);
  titleRow.font={bold:true,size:14};
  ws.addRow(['Currency: '+state.currency+(isBDT()?' | VAT: '+state.vat+'%':' | Freight entered per vendor')]);
  ws.addRow([]);
  var header=['#','Item','Qty','Unit'];state.vendors.forEach(function(v){var label=[v.manufacturer,v.localAgent,v.origin,v.model].filter(Boolean).join(' / ')||'Vendor';header.push(label+' unit price',label+' total');});
  var h=ws.addRow(header);h.font={bold:true,color:{argb:'FFFFFFFF'}};h.eachCell(function(cell){cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF14243D'}};cell.alignment={wrapText:true,vertical:'middle'};});
  state.items.forEach(function(it,i){var row=[i+1,it.name,it.qty,it.unit];state.vendors.forEach(function(v,j){var p=+it.prices[j]||0;row.push(p||null,p?(+it.qty||0)*p:null);});ws.addRow(row);});
  ws.addRow([]);ws.addRow(['Manufacturer / vendor comments']).font={bold:true,size:12};state.vendors.forEach(function(v){var rr=ws.addRow([v.manufacturer||v.localAgent||'Vendor',v.comments||'']);rr.getCell(2).alignment={wrapText:true,vertical:'top'};});
  (isBDT()?[['Subtotal','subtotal'],['VAT','vat'],['Grand total','total']]:[['Subtotal','subtotal'],['Freight','freight'],['Grand total','total']]).forEach(function(pair){var row=['',pair[0],'',''];ts.forEach(function(x){row.push('',pair[1]==='vat'&&!isBDT()?'—':pair[1]==='freight'&&isBDT()?'—':x[pair[1]]);});ws.addRow(row).font={bold:true};});
  ws.getColumn(2).width=34;ws.getColumn(3).width=10;ws.getColumn(4).width=10;state.vendors.forEach(function(v,j){ws.getColumn(5+j*2).width=18;ws.getColumn(6+j*2).width=18;});
  ws.eachRow(function(row){row.eachCell(function(cell){if(typeof cell.value==='number'&&cell.col>4)cell.numFmt='#,##0.00';});});
  var blob=await wb.xlsx.writeBuffer(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([blob],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='Quotation_Comparison.xlsx';a.click();URL.revokeObjectURL(a.href);
};
render();
})();
</script></body></html>
