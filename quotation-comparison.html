<style>

.wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:640px}td,th{border:1px solid var(--line);padding:6px;vertical-align:top}th{background:#eef3f9;font-size:12px;text-align:left}td input,th input,th select{width:100%;margin-bottom:4px}.num{text-align:right}

*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
html,body{margin:0!important;padding:0!important;background:#fff!important;color:#14243d!important;font-size:11pt;line-height:1.35}
.no-print,header{display:none!important}
main{width:100%;max-width:none;margin:0;padding:0}
.card{border:0;border-radius:0;padding:0;margin:0 0 4mm;box-shadow:none}

}

<body><header><h1>Quotation Comparison</h1><a href="index.html">← DocuWorks Studio</a></header>
<main>

<div class="card no-print">
<h3 style="margin:0 0 10px">Item Details</h3>
<div class="wrap"><table id="itemTable"></table></div>
<div class="row" style="margin-top:12px">

<div id="vatWrap"><label>VAT (%)</label><input id="vat" type="number" min="0" step="0.01" style="width:90px"></div>
<button class="secondary" id="addItem">+ Item</button><button class="secondary" id="addVendor">+ Vendor</button><button id="export">Download Excel</button><button class="secondary" id="clear">Clear all</button>
</div>
</div>
<div class="card"><h3 id="comparisonHeading" style="margin:0 0 8px">Price Comparison</h3><div class="wrap"><table id="table"></table></div></div>
<div class="card"><h3 style="margin:0 0 8px">Result</h3><div class="cards" id="results"></div></div>
<div class="card"><h3 style="margin:0 0 8px">Comments</h3><div id="printRates"></div><div class="cards" id="comments"></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var symbols={BDT:'৳',USD:'$',GBP:'£',EUR:'€',CHF:'CHF',INR:'₹',CNY:'¥',JPY:'¥',CAD:'$',AUD:'$',AED:'د.إ'};
var saved=null;try{saved=JSON.parse(localStorage.getItem('dw-quote')||'null');}catch(e){}
var state=saved||{area:'',cerNumber:'',currency:'BDT',vat:15,exchangeRate:1,vendors:[{manufacturer:'',localAgent:'Vendor A',origin:'',model:'',freight:0},{manufacturer:'',localAgent:'Vendor B',origin:'',model:'',freight:0},{manufacturer:'',localAgent:'Vendor C',origin:'',model:'',freight:0}],items:[{name:'',qty:1,unit:'pcs',prices:[0,0,0]}]};
if(!symbols[state.currency])state.currency='BDT';if(state.exchangeRate===undefined)state.exchangeRate=1;
if(state.area===undefined)state.area='';if(state.cerNumber===undefined)state.cerNumber='';
state.vendors=state.vendors||[];
state.items=state.items||[];
state.vendors.forEach(function(v){if(v.localAgent===undefined)v.localAgent=v.name||v.n||'Vendor';if(v.manufacturer===undefined)v.manufacturer='';if(v.origin===undefined)v.origin='';if(v.model===undefined)v.model='';if(v.comments===undefined)v.comments='';if(v.freight===undefined)v.freight=0;if(v.incl===undefined)v.incl=0;if(!symbols[v.currency])v.currency=state.currency||'BDT';if(v.exchangeRate===undefined)v.exchangeRate=state.exchangeRate===undefined?1:state.exchangeRate;});
state.items.forEach(function(it){if(it.name===undefined)it.name=it.n||'';if(it.qty===undefined)it.qty=it.q||1;if(it.unit===undefined)it.unit=it.u||'pcs';if(!Array.isArray(it.prices))it.prices=it.p||[];while(it.prices.length<state.vendors.length)it.prices.push(0);});
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(n){return (+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function isBDT(v){return (v?v.currency:state.currency)==='BDT';}
function money(n,j){var v=state.vendors[j];return (symbols[v.currency]||v.currency)+' '+fmt(n);}
function totals(){return state.vendors.map(function(v,j){var raw=state.items.reduce(function(sum,it){return sum+(+it.qty||0)*(+it.prices[j]||0);},0);var rate=(+state.vat||0)/100;var bdt=isBDT(v);var subtotal=bdt&&v.incl?raw/(1+rate):raw;var vat=bdt?(v.incl?raw-subtotal:subtotal*rate):0;var freight=+v.freight||0;var total=Math.round((subtotal+vat+freight)*100)/100;return {subtotal:subtotal,vat:vat,freight:freight,total:total,totalBDT:Math.round(total*(bdt?1:(+v.exchangeRate||0))*100)/100};});}
function persist(){try{localStorage.setItem('dw-quote',JSON.stringify(state));}catch(e){}}
function updateComparisonHeading(){var item=(state.items[0]&&state.items[0].name.trim())||'Item Name';var area=(state.area&&state.area.trim())||'Area';var cer=(state.cerNumber&&state.cerNumber.trim())||'CER Number';$('#comparisonHeading').textContent='Price Comparison of '+item+', '+area+', '+cer;}
function render(){
  updateComparisonHeading();
  $('#vat').value=state.vat;
  $('#vatWrap').style.display=state.vendors.some(function(v){return isBDT(v);})?'':'none';
  var itemHtml='<thead><tr><th style="min-width:180px">Item / description</th><th style="width:65px">Qty</th><th style="width:75px">Unit</th><th style="min-width:125px">Area</th><th style="min-width:125px">CER Number</th><th class="no-print"></th></tr></thead><tbody>';
  state.items.forEach(function(it,i){itemHtml+='<tr><td><input data-item-name="'+i+'" value="'+esc(it.name)+'" placeholder="Item / description"></td><td><input type="number" min="0" step="any" data-qty="'+i+'" value="'+it.qty+'"></td><td><input data-unit="'+i+'" value="'+esc(it.unit)+'"></td><td>'+(i===0?'<input id="area" value="'+esc(state.area||'')+'" placeholder="Enter area">':'')+'</td><td>'+(i===0?'<input id="cerNumber" value="'+esc(state.cerNumber||'')+'" placeholder="CER Number">':'')+'</td><td class="no-print"><button class="remove" data-remove-item="'+i+'">×</button></td></tr>';});
  itemHtml+='</tbody>';$('#itemTable').innerHTML=itemHtml;
  var html='<thead><tr><th style="min-width:180px">Details</th><th style="width:70px">Qty</th>';
  state.vendors.forEach(function(v,j){html+='<th style="min-width:185px"><label>Currency</label><select data-vcurrency="'+j+'">'+Object.keys(symbols).map(function(cur){return '<option value="'+cur+'"'+(v.currency===cur?' selected':'')+'>'+cur+' ('+symbols[cur]+')</option>';}).join('')+'</select><div class="currency-mark" title="Selected currency">'+esc(symbols[v.currency]||v.currency)+' '+esc(v.currency)+'</div><label>Rate to BDT (1 '+esc(v.currency)+')</label><input type="number" min="0" step="any" data-vrate="'+j+'" value="'+esc(v.exchangeRate)+'" title="BDT per one unit of '+esc(v.currency)+'"><button class="remove no-print" data-remove-vendor="'+j+'" title="Remove vendor">Remove vendor</button></th>';});
  html+='</tr></thead><tbody>';
  [['Manufacturer name','manufacturer'],['Local agent','localAgent'],['Origin','origin'],['Model','model']].forEach(function(meta){html+='<tr><td><b>'+meta[0]+'</b></td><td></td>';state.vendors.forEach(function(v,j){var key=meta[1],attr=key==='manufacturer'?'data-vmanufacturer':key==='localAgent'?'data-vagent':key==='origin'?'data-vorigin':'data-vmodel';html+='<td><input '+attr+'="'+j+'" value="'+esc(v[key]||'')+'" placeholder="'+meta[0]+'"></td>';});html+='</tr>';});
  state.items.forEach(function(it,i){html+='<tr><td><b data-item-label="'+i+'">'+esc(it.name||('Item '+(i+1)))+'</b></td>';html+='<td class="num qty-display">'+esc(it.qty)+'</td>';state.vendors.forEach(function(v,j){html+='<td><input type="number" min="0" step="any" class="num" data-price="'+i+','+j+'" value="'+(it.prices[j]||'')+'"></td>';});html+='</tr>';});
  html+='</tbody><tfoot><tr><td>Subtotal</td><td></td>';state.vendors.forEach(function(){html+='<td class="num"></td>';});html+='</tr><tr><td>Freight</td><td></td>';state.vendors.forEach(function(v,j){html+='<td><input type="number" min="0" step="any" data-freight-row="'+j+'" value="'+(v.freight||'')+'" placeholder="Enter freight"></td>';});html+='</tr>'+(state.vendors.some(function(v){return isBDT(v);})?'<tr><td>VAT</td><td></td>'+state.vendors.map(function(){return '<td class="num"></td>';}).join('')+'</tr>':'')+'<tr><td>Grand total</td><td></td>';state.vendors.forEach(function(){html+='<td class="num"></td>';});html+='</tr><tr><td>Grand total (BDT)</td><td></td>';state.vendors.forEach(function(){html+='<td class="num"></td>';});html+='</tr></tfoot>';
  $('#table').innerHTML=html;calculate();
}
function calculate(){
  var table=$('#table'),ts=totals(),valid=ts.map(function(x){return x.totalBDT;}).filter(function(x){return x>0;}),min=valid.length?Math.min.apply(null,valid):null,max=valid.length?Math.max.apply(null,valid):null;
  $('#results').style.setProperty('--vendor-count',state.vendors.length);
  $('#results').innerHTML=state.vendors.map(function(v,j){var x=ts[j]||{total:0,totalBDT:0};var best=min!==null&&x.totalBDT>0&&x.totalBDT===min;return '<div class="vendor-card'+(best?' best':'')+'"><b>'+esc(v.manufacturer||'Manufacturer not entered')+'</b><div class="muted">Local agent: '+esc(v.localAgent||'—')+'<br>Origin: '+esc(v.origin||'—')+'<br>Model: '+esc(v.model||'—')+'</div>'+(best?'<span class="badge">Lowest</span>':'')+'<div class="total">'+money(x.total,j)+'</div></div>';}).join('');
  $('#comments').style.setProperty('--vendor-count',state.vendors.length);
  $('#comments').innerHTML=state.vendors.map(function(v,j){return '<div class="vendor-card"><b>'+esc(v.manufacturer||v.localAgent||('Vendor '+(j+1)))+'</b><label style="margin-top:10px">Comments</label><textarea data-comment="'+j+'" rows="3" style="width:100%;resize:vertical" placeholder="Enter comments for this manufacturer">'+esc(v.comments||'')+'</textarea></div>';}).join('');
  state.items.forEach(function(it,i){var itemLabel=table.querySelector('[data-item-label="'+i+'"]'),displayName=it.name&&it.name.trim()?it.name.trim():'Item '+(i+1);if(itemLabel)itemLabel.textContent=displayName;var rowIndex=4+i;state.vendors.forEach(function(v,j){var cell=table.tBodies[0].rows[rowIndex].cells[2+j];cell.classList.remove('lowest');var p=+it.prices[j]||0;var prices=state.vendors.map(function(vv,k){var q=+it.prices[k]||0;return q>0?(isBDT(vv)&&vv.incl?q/(1+(+state.vat||0)/100):q)*(isBDT(vv)?1:(+vv.exchangeRate||0)):null;}).filter(function(x){return x!==null;});var compare=(isBDT(v)&&v.incl?p/(1+(+state.vat||0)/100):p)*(isBDT(v)?1:(+v.exchangeRate||0));if(p>0&&prices.length>1&&compare===Math.min.apply(null,prices))cell.classList.add('lowest');});});
  ts.forEach(function(x,j){var hasBDT=state.vendors.some(function(v){return isBDT(v);});var sym=symbols[state.vendors[j].currency]||state.vendors[j].currency;table.tFoot.rows[0].cells[2+j].textContent=sym+' '+fmt(x.subtotal);if(hasBDT&&isBDT(state.vendors[j]))table.tFoot.rows[2].cells[2+j].textContent='৳ '+fmt(x.vat);var totalRow=hasBDT?3:2;table.tFoot.rows[totalRow].cells[2+j].textContent=sym+' '+fmt(x.total);table.tFoot.rows[totalRow+1].cells[2+j].textContent='৳ '+fmt(x.totalBDT);if(min!==null&&x.totalBDT>0&&x.totalBDT===min)table.tFoot.rows[totalRow+1].cells[2+j].classList.add('lowest');else table.tFoot.rows[totalRow+1].cells[2+j].classList.remove('lowest');});
  $('#results').style.setProperty('--vendor-count',state.vendors.length);$('#comments').style.setProperty('--vendor-count',state.vendors.length);$('#printRates').style.setProperty('--vendor-count',state.vendors.length);var seenRates={};var rateLines=[];state.vendors.forEach(function(v){var cur=v.currency||'BDT';var rate=fmt(cur==='BDT'?1:v.exchangeRate);var key=cur+'|'+rate;if(!seenRates[key]){seenRates[key]=true;if(cur!=='BDT')rateLines.push('BDT (1 '+esc(cur)+'): '+rate);}});$('#printRates').innerHTML=rateLines.length?'<b>Ex. Rate:</b> '+rateLines.map(function(line){return '<span class="rate-line">'+line+'</span>';}).join(''):'<b>Ex. Rate:</b> BDT (1 BDT): 1.00';
  persist();
}
$('#itemTable').addEventListener('input',function(e){if(e.target.id==='area'){state.area=e.target.value;updateComparisonHeading();calculate();}else if(e.target.id==='cerNumber'){state.cerNumber=e.target.value;updateComparisonHeading();calculate();}});
$('#table').addEventListener('change',function(e){var d=e.target.dataset;if(d.vcurrency!==undefined){state.vendors[+d.vcurrency].currency=e.target.value;render();}});
$('#table').addEventListener('input',function(e){var d=e.target.dataset;if(d.vrate!==undefined){state.vendors[+d.vrate].exchangeRate=Math.max(0,parseFloat(e.target.value)||0);calculate();}});
$('#vat').addEventListener('input',function(e){state.vat=+e.target.value||0;calculate();});
$('#comments').addEventListener('input',function(e){var j=e.target.dataset.comment;if(j!==undefined){state.vendors[+j].comments=e.target.value;persist();}});
$('#itemTable').addEventListener('input',function(e){var el=e.target,d=el.dataset;if(d.itemName!==undefined){state.items[+d.itemName].name=el.value;if(+d.itemName===0){updateComparisonHeading();}}else if(d.qty!==undefined)state.items[+d.qty].qty=+el.value||0;else if(d.unit!==undefined)state.items[+d.unit].unit=el.value;calculate();});
$('#table').addEventListener('input',function(e){var el=e.target,d=el.dataset;if(d.vrate!==undefined){state.vendors[+d.vrate].exchangeRate=Math.max(0,parseFloat(el.value)||0);}else if(d.vcurrency!==undefined){state.vendors[+d.vcurrency].currency=el.value;}else if(d.vmanufacturer!==undefined)state.vendors[+d.vmanufacturer].manufacturer=el.value;else if(d.vagent!==undefined)state.vendors[+d.vagent].localAgent=el.value;else if(d.vorigin!==undefined)state.vendors[+d.vorigin].origin=el.value;else if(d.vmodel!==undefined)state.vendors[+d.vmodel].model=el.value;else if(d.incl!==undefined)state.vendors[+d.incl].incl=+el.value;else if(d.freightRow!==undefined||d.freight!==undefined){var j=+(d.freightRow!==undefined?d.freightRow:d.freight);state.vendors[j].freight=Math.max(0,parseFloat(el.value)||0);}else if(d.price!==undefined){var a=d.price.split(',');state.items[+a[0]].prices[+a[1]]=+el.value||0;}calculate();});
$('#table').addEventListener('change',function(e){var d=e.target.dataset;if(d.freightRow!==undefined||d.freight!==undefined){var j=+(d.freightRow!==undefined?d.freightRow:d.freight);state.vendors[j].freight=Math.max(0,parseFloat(e.target.value)||0);calculate();}});
$('#itemTable').addEventListener('click',function(e){var d=e.target.dataset;if(d.removeItem!==undefined&&state.items.length>1){state.items.splice(+d.removeItem,1);render();}});
$('#table').addEventListener('click',function(e){var d=e.target.dataset;if(d.removeVendor!==undefined&&state.vendors.length>1){var j=+d.removeVendor;state.vendors.splice(j,1);state.items.forEach(function(it){it.prices.splice(j,1);});render();}});
$('#addItem').onclick=function(){state.items.push({name:'',qty:1,unit:'pcs',prices:state.vendors.map(function(){return 0;})});render();};
$('#addVendor').onclick=function(){if(state.vendors.length>=8){alert('Maximum 8 vendors.');return;}var previous=state.vendors[state.vendors.length-1]||{};state.vendors.push({manufacturer:'',localAgent:'Local agent '+String.fromCharCode(65+state.vendors.length),origin:'',model:'',freight:0,incl:0,currency:previous.currency||'BDT',exchangeRate:previous.exchangeRate===undefined?1:previous.exchangeRate});state.items.forEach(function(it){it.prices.push(0);});render();};
$('#clear').onclick=function(){if(confirm('Clear all quotation data from this browser?')){localStorage.removeItem('dw-quote');location.reload();}};
$('#export').onclick=async function(){
  if(!window.ExcelJS){alert('Excel export library did not load. Check your internet connection.');return;}
  var wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Comparison'),ts=totals();
  var titleRow=ws.addRow(['Item / description: '+((state.items[0]&&state.items[0].name.trim())||'—'),'Area: '+(state.area||'—'),'CER Number: '+(state.cerNumber||'—')]);
  titleRow.font={bold:true,size:14};
