<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f9fc">
<meta name="description" content="DocuWorks Studio — a professional workspace for document and procurement tools.">
<title>DocuWorks Studio | Workspace</title>
<style>
:root{color-scheme:light;--ink:#172b4d;--muted:#687a94;--line:#e3e9f2;--blue:#2458d3;--blue-dark:#1744ad;--blue-soft:#edf3ff;--canvas:#f5f7fb;--white:#fff}
*{box-sizing:border-box}html{min-height:100%;background:var(--canvas)}body{margin:0;color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:72px auto}.topbar{grid-column:1/-1;grid-row:1;display:flex;align-items:center;padding:0 32px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:#fff;background:linear-gradient(145deg,#3975f1,#1744ad);box-shadow:0 5px 12px #2458d32b}.brand-mark svg{width:23px;height:23px}.brand-copy{display:flex;flex-direction:column;line-height:1.2}.brand-name{font-size:17px;font-weight:800;letter-spacing:-.045em}.brand-sub{font-size:9px;color:#8794a8;text-transform:uppercase;letter-spacing:.17em;margin-top:5px;font-weight:750}
.top-right{margin-left:auto}.secure-label{display:flex;align-items:center;gap:8px;color:#718099;font-size:11px;font-weight:650}.secure-dot{width:7px;height:7px;background:#2eaa78;border-radius:50%;box-shadow:0 0 0 3px #e8f7f0}
.sidebar{grid-column:1;grid-row:2;min-height:calc(100vh - 72px);background:#fff;border-right:1px solid var(--line);padding:28px 15px 18px;display:flex;flex-direction:column;gap:7px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:800;color:#a0aabd;padding:0 13px;margin:0 0 9px}.nav-link{width:100%;display:flex;align-items:center;gap:12px;padding:11px 13px;border:0;border-radius:9px;background:transparent;text-align:left;color:#667790;font-weight:650}.nav-link.active{background:#edf3ff;color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}.nav-link:hover{background:#f4f7fc;color:var(--blue)}.nav-link svg{width:18px;height:18px;flex:none}.sidebar-note{margin-top:auto;padding:16px 13px 4px;border-top:1px solid #edf0f5;color:#9aa6b8;font-size:11px;line-height:1.7}.sidebar-note strong{display:block;color:#64758e;font-size:11px;margin-bottom:2px}
.workspace{grid-column:2;grid-row:2;min-width:0;padding:34px clamp(22px,4.2vw,58px) 36px;max-width:1500px;width:100%;margin:0 auto}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:17px}.section-title{font-size:17px;font-weight:800;letter-spacing:-.03em;margin:0;color:#1c3151}.section-subtitle{font-size:12px;color:#8190a5;margin:5px 0 0}.tool-count{font-size:10px;font-weight:750;letter-spacing:.04em;color:#637590;background:#fff;border:1px solid var(--line);padding:6px 10px;border-radius:7px;white-space:nowrap}
.controls{display:flex;align-items:center;gap:10px;margin-bottom:16px}.search-wrap{position:relative;flex:1;max-width:510px}.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#91a0b5}.search{width:100%;height:44px;padding:0 14px 0 41px;border:1px solid #dfe6f0;border-radius:10px;background:#fff;outline:none;color:var(--ink);box-shadow:0 2px 4px #14284a05}.search::placeholder{color:#9aa6b8}.search:focus{border-color:#8daaf0;box-shadow:0 0 0 3px #2458d314}
.settings-panel{display:none;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;margin:0 0 14px;max-width:510px}.settings-panel.visible{display:block}.settings-title{font-weight:750;margin-bottom:9px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;color:#65758e;font-size:12px}.toggle{border:1px solid #d9e4fa;background:#f4f7ff;border-radius:7px;padding:7px 10px;color:var(--blue);font-size:11px;font-weight:750}
.tool-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;max-width:1060px}.tool{min-height:138px;height:138px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;text-align:center;border:1px solid #e6ebf3;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(25,49,91,.025);transition:transform .18s,border-color .18s,box-shadow .18s}.tool:hover{transform:translateY(-2px);border-color:#c9d7f4;box-shadow:0 5px 14px rgba(31,65,132,.07)}.tool-icon{width:62px;height:62px;border-radius:17px;position:relative;overflow:hidden;display:grid;place-items:center;border:1px solid transparent;box-shadow:0 3px 8px rgba(24,52,100,.07),inset 0 1px 0 rgba(255,255,255,.8)}.tool-icon:before{content:"";position:absolute;width:68px;height:68px;right:-26px;top:-27px;border:1px solid currentColor;border-radius:20px;opacity:.13;transform:rotate(25deg)}.tool-icon:after{content:"";position:absolute;width:38px;height:38px;left:-21px;bottom:-22px;border:1px solid currentColor;border-radius:12px;opacity:.12;transform:rotate(25deg)}.tool-icon svg{position:relative;z-index:1;width:31px;height:31px}.tool>span:nth-child(2){width:100%}.tool-title{display:block;font-size:12.5px;line-height:1.35;font-weight:700}.tool-desc,.tool-action{display:none}
.tool:nth-child(1) .tool-icon{background:linear-gradient(145deg,#e8f8ff,#ccecff);color:#0877b9;border-color:#c9eafa}.tool:nth-child(2) .tool-icon{background:linear-gradient(145deg,#f0ebff,#ded6ff);color:#6941c6;border-color:#ddd3ff}.tool:nth-child(3) .tool-icon{background:linear-gradient(145deg,#fff0f0,#ffdada);color:#c43f50;border-color:#f9d2d7}.tool:nth-child(4) .tool-icon{background:linear-gradient(145deg,#e5fbf3,#c8f2e4);color:#138663;border-color:#c8eee1}.tool:nth-child(5) .tool-icon{background:linear-gradient(145deg,#fff5df,#ffe5ad);color:#a56a05;border-color:#f8e2b7}
.empty{display:none;padding:25px;text-align:center;color:#7a899f;border:1px dashed #cad6e7;border-radius:12px;background:#fff}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1060px;margin-top:28px;padding-top:16px;border-top:1px solid #e5eaf2;color:#9aa6b8;font-size:10px}.menu-button{display:none;width:36px;height:36px;place-items:center;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--ink)}
@media(max-width:1180px){.tool-list{grid-template-columns:repeat(3,minmax(0,1fr));max-width:820px;gap:12px}.tool{height:136px;min-height:136px}}
@media(max-width:850px){.app{grid-template-columns:205px minmax(0,1fr)}.workspace{padding:25px 22px}.tool-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tool{height:130px;min-height:130px;padding:13px 8px}.tool-icon{width:58px;height:58px}.tool-icon svg{width:29px;height:29px}}
@media(max-width:680px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:62px auto auto}.topbar{grid-row:1;padding:0 15px;gap:11px}.menu-button{display:grid;flex:none}.brand-mark{width:35px;height:35px}.brand-name{font-size:15px}.brand-sub{font-size:8px}.sidebar{display:none;grid-column:1;grid-row:2;min-height:0;border-right:0;border-bottom:1px solid var(--line);padding:12px 15px}.sidebar.open{display:flex}.sidebar-note{display:none}.workspace{grid-column:1;grid-row:3;padding:19px 15px 25px}.tool-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tool{height:132px;min-height:132px;padding:14px 8px}.tool-icon{width:60px;height:60px}.tool-icon svg{width:30px;height:30px}.tool-title{font-size:12.5px}}
@media(max-width:360px){.tool-list{gap:8px}.tool{height:124px;min-height:124px;padding:12px 5px}.tool-icon{width:55px;height:55px}.tool-icon svg{width:27px;height:27px}.tool-title{font-size:11.5px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar">
<button class="menu-button" id="menuButton" type="button" aria-label="Toggle navigation" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<a class="brand" href="./index.html" aria-label="DocuWorks Studio home"><span class="brand-mark"><svg viewBox="0 0 32 32" fill="none"><path d="M9 3.8h10l6 6V26a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5.8a2 2 0 0 1 2-2Z" fill="currentColor" opacity=".2"/><path d="M9 3.8h10l6 6V26a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5.8a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7"/><path d="M19 4v5a1 1 0 0 0 1 1h5M11 15h10M11 19h10M11 23h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span class="brand-copy"><span class="brand-name">DocuWorks Studio</span><span class="brand-sub">Built by Shuvo</span></span></a>
</header>
<aside class="sidebar" id="sidebar"><div class="nav-label">Workspace</div><a class="nav-link active" href="./index.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z"/></svg>Home</a><button class="nav-link" id="settingsButton" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="m19 13 2-1-2-3-2 .5a7 7 0 0 0-2-1.1L15 6h-3l-.5 2.4a7 7 0 0 0-2 1.1L7 9 5 12l2 1a7 7 0 0 0 0 2l-2 1 2 3 2.5-.5a7 7 0 0 0 2 1.1L12 21h3l.5-2.4a7 7 0 0 0 2-1.1L20 18l2-3-2-1a7 7 0 0 0 0-1Z"/></svg>Settings</button></aside>
<main class="workspace">
<div class="section-head"><div><h2 class="section-title">Tools &amp; workflows</h2><p class="section-subtitle">Everything you need, in one place.</p></div><span class="tool-count">4 TOOLS</span></div>
<div class="settings-panel" id="settingsPanel"><div class="settings-title">Display preferences</div><div class="setting-row"><span>Compact tool list</span><button class="toggle" id="densityButton" type="button" aria-pressed="false">Turn on</button></div></div>
<div class="controls"><label class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><input class="search" id="toolSearch" type="search" placeholder="Search tools..." aria-label="Search document tools"></label></div>
<section class="tool-list" id="toolList" aria-label="Document tools">
<a class="tool" href="./scan.html" data-search="document scanner scan clean export capture"><span class="tool-icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="5" width="32" height="9" rx="3"/><rect x="5" y="17" width="38" height="15" rx="4"/><path d="M11 32v9h26v-9M14 24h.01M19 24h15"/><path d="m18 9 3 3 7-7" stroke="#fff" stroke-width="1.8"/></svg></span><span><span class="tool-title">Document Scanner</span></span></a>
<a class="tool" href="./cs.html" data-search="urs cs maker technical documentation excel workbook"><span class="tool-icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h18l9 9v29H11a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"/><path d="M29 5v10h9M15 22h18M15 28h18M15 34h9"/><path d="m27 37 4 4 8-9" stroke="#fff" stroke-width="2.5"/></svg></span><span><span class="tool-title">URS → CS Maker</span></span></a>
<a class="tool" href="./ink-saver.html" data-search="pdf optimizer readability ink backgrounds clean optimize"><span class="tool-icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4h18l9 9v30H11a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/><path d="M29 4v10h9M15 23h17M15 29h12"/><rect x="14" y="33" width="20" height="6" rx="2" fill="#fff"/><path d="M18 36h12" stroke-width="2.5"/></svg></span><span><span class="tool-title">PDF Optimizer</span></span></a>
<a class="tool" href="./price-reduction.html" data-search="price reduction quotation processing pdf remove prices review export"><span class="tool-icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="36" height="38" rx="5"/><path d="M14 14h20M14 21h10"/><circle cx="30" cy="29" r="8" fill="#fff"/><path d="M26.5 32.5 33.5 25.5M27 26h.01M33 32h.01" stroke-width="2.4"/><path d="M14 36h5"/></svg></span><span><span class="tool-title">Price Reduction Tool</span></span></a>
</section>
<div class="empty" id="emptyState">No tools match your search. Try another keyword.</div>
<footer class="footer"><span>DocuWorks Studio</span><span>Built by Shuvo</span></footer>
</main>
</div>
<script>
const app=document.getElementById('app'),sidebar=document.getElementById('sidebar'),menuButton=document.getElementById('menuButton'),settingsButton=document.getElementById('settingsButton'),settingsPanel=document.getElementById('settingsPanel'),densityButton=document.getElementById('densityButton'),search=document.getElementById('toolSearch'),tools=[...document.querySelectorAll('.tool')],emptyState=document.getElementById('emptyState');
menuButton.addEventListener('click',()=>{const open=sidebar.classList.toggle('open');menuButton.setAttribute('aria-expanded',String(open));});
settingsButton.addEventListener('click',()=>{settingsPanel.classList.toggle('visible');settingsButton.classList.toggle('active',settingsPanel.classList.contains('visible'));});
densityButton.addEventListener('click',()=>{const compact=app.classList.toggle('compact');densityButton.textContent=compact?'Turn off':'Turn on';densityButton.setAttribute('aria-pressed',String(compact));});
search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();let shown=0;tools.forEach(tool=>{const match=(tool.dataset.search+' '+tool.innerText).toLowerCase().includes(q);tool.style.display=match?'flex':'none';if(match)shown++;});emptyState.style.display=shown?'none':'block';});
</script>
</body>
</html>
