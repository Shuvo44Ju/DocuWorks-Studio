<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Gantt</title>
<link rel="stylesheet" href="./projectflow.css">
</head>
<body>
<header>
  <h1 id="t">Project Gantt</h1>
  <div class="bar">
    <span id="k"></span>
    <input id="q" placeholder="Search task" aria-label="Search task">
    <select id="f" aria-label="Filter state">
      <option value="">All states</option>
      <option>Done</option>
      <option>In progress</option>
      <option>Overdue</option>
      <option>Planned</option>
      <option>No date</option>
    </select>
    <label>Zoom <input id="z" type="range" min="1" max="8" step="0.5" value="3" aria-label="Zoom"></label>
    <button id="export" type="button">↓ Export Excel</button>
  </div>
</header>

<main>
  <section id="upload">
    <label class="dropzone" for="fileInput" id="dropzone">
      <strong>Choose your Excel file</strong>
      <span>Drag and drop here, or click to browse · .xlsx, .xls, .csv</span>
      <input id="fileInput" type="file" accept=".xlsx,.xls,.csv">
    </label>
    <div id="info"></div>
  </section>
  <section id="wrap" aria-label="Gantt chart"></section>
</main>

<script src="./projectflow.js"></script>
</body>
</html>
